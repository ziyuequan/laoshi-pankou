<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>
<title>老师行为盘口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style id="app-css">
/* Layout: one poster column. A Nordic-cross masthead, then each 盘 as a band split by heavy yellow rules. The palette is literally 蓝底黄字. */
:root{
  --blue:#0B4A8E;
  --blue-deep:#06386E;
  --blue-lift:#15599F;
  --yellow:#FFCD00;
  --paper:#DDE7F3;
  --mute:#AFC3DD;
  --line:rgba(255,205,0,.34);
  --alert:#FF9E82;
  --display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC",sans-serif;
  --num:"Big Shoulders Display","Arial Narrow","Noto Sans SC",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--blue)}
body{background:var(--blue);color:var(--yellow);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:28px 116px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* masthead */
.mast{display:flex;flex-direction:column}
.eyebrow{margin:0 0 10px;font-size:13px;font-weight:500;letter-spacing:.14em;color:var(--paper)}
.title{margin:0;font:400 clamp(46px,13vw,92px)/1 var(--display);letter-spacing:.02em;text-wrap:balance;overflow-wrap:anywhere}
.cross{position:relative;height:58px;margin:22px 0 18px}
.cross::before{content:"";position:absolute;left:0;right:0;top:50%;height:12px;margin-top:-6px;background:var(--yellow)}
.cross::after{content:"";position:absolute;top:0;bottom:0;left:min(24%,128px);width:12px;background:var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
.stats div{display:flex;flex-direction:column;gap:4px;min-width:0}
.stats dt{font-size:12px;letter-spacing:.16em;color:var(--paper)}
.stats dd{margin:0;font:800 clamp(36px,10vw,56px)/1 var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats small{margin-left:4px;font:500 13px var(--body);letter-spacing:0;color:var(--paper)}

.banner{margin:26px 0 0;padding:10px 14px;border:2px solid var(--yellow);font-weight:500}
.banner p{margin:0}
.banner .acts{margin-top:10px}
.loading{margin:48px 0;color:var(--paper)}
.note{display:flex;gap:12px;align-items:flex-start;margin-top:26px;padding:12px 8px 12px 14px;border:2px dashed var(--line);color:var(--paper);font-size:14px}
.note p{margin:0;flex:1;min-width:0}
.note .lbl{display:inline-block;margin-right:8px;padding:0 7px;background:var(--yellow);color:var(--blue-deep);font-size:12px;font-weight:700;border-radius:2px;vertical-align:1px}

/* markets */
.mkts{display:flex;flex-direction:column;margin-top:36px}
.mkt{display:flex;flex-direction:column;gap:14px;padding-block:18px 30px;border-top:4px solid var(--yellow)}
.mkt-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mkt-no{font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--paper)}
.mkt-no b{margin:0 3px;font:800 30px/1 var(--num);color:var(--yellow);vertical-align:-3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border:1.5px solid var(--yellow);border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.chip-open::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--yellow);animation:blink 1.6s ease-in-out infinite}
.chip-locked{border-color:var(--mute);color:var(--mute)}
.chip-settled{background:var(--yellow);color:var(--blue-deep)}
@keyframes blink{50%{opacity:.2}}
.mkt-q{margin:0;font:400 clamp(27px,6.6vw,38px)/1.15 var(--display);text-wrap:balance;overflow-wrap:anywhere}
.mkt-meta{margin:-6px 0 0;font-size:13px;color:var(--paper)}
.mkt-meta b{font:800 17px var(--num);color:var(--yellow)}
.hint{margin:0;padding:10px 14px;background:var(--yellow);color:var(--blue-deep);font-weight:700;border-radius:4px}
.empty-mkt{padding:22px 0;border-top:4px solid var(--yellow);color:var(--paper)}
.empty-mkt p{margin:0}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--blue-deep);border-radius:4px}
.opt-pick{appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"label odds" "bar bar" "pool pool";gap:6px 14px;width:100%;padding:12px 14px;margin:0;background:none;border:2px solid transparent;border-radius:4px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.opt-pick:disabled{cursor:default}
.opt-pick:not(:disabled):hover{background:var(--blue-lift)}
.is-sel .opt-pick{border-color:var(--yellow)}
.is-settling .opt-pick:not(:disabled){border:2px dashed var(--line)}
.opt-label{grid-area:label;min-width:0;font-size:16.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.opt-odds{grid-area:odds;align-self:center;font:800 28px/1 var(--num);font-variant-numeric:tabular-nums}
.opt-bar{grid-area:bar;height:8px;background:rgba(255,205,0,.16);border-radius:2px;overflow:hidden}
.opt-bar i{display:block;height:100%;background:var(--yellow);transition:width .45s cubic-bezier(.2,.7,.2,1)}
.opt-pool{grid-area:pool;font-size:12.5px;color:var(--paper);font-variant-numeric:tabular-nums}
.tick,.stamp{font-style:normal;margin-right:8px;padding:1px 7px;border-radius:2px;vertical-align:2px}
.tick{background:var(--yellow);color:var(--blue-deep);font-size:11.5px;font-weight:700}
.stamp{background:var(--blue-deep);color:var(--yellow);font:400 13px var(--display)}
.is-win{background:var(--yellow);color:var(--blue-deep)}
.is-win .opt-pool{color:var(--blue-deep)}
.is-win .opt-bar{background:rgba(6,56,110,.2)}
.is-win .opt-bar i{background:var(--blue-deep)}
.is-lose{opacity:.6}
.opt-bets{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0 14px 12px;list-style:none}
.opt-bets li{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:1px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--paper)}
.opt-bets li b{font:800 15px var(--num);color:var(--yellow)}
.opt-bets li:has(.x){padding-right:2px}
.is-win .opt-bets li{border-color:rgba(6,56,110,.35);color:var(--blue-deep)}
.is-win .opt-bets li b{color:var(--blue-deep)}
.x{appearance:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:0;border-radius:999px;background:none;color:var(--mute);font-size:17px;line-height:1;cursor:pointer}
.x:hover{background:var(--blue-lift);color:var(--yellow)}
.x:disabled{opacity:.3;cursor:not-allowed}

.payout{padding:2px 0 2px 14px;border-left:4px solid var(--yellow);color:var(--paper);font-size:14px}
.payout p{margin:0}
.payout ul{margin:6px 0 0;padding:0;list-style:none}
.payout b{font:800 18px var(--num);color:var(--yellow)}
.payout strong{color:var(--yellow)}

/* forms */
.betform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:12px;align-items:end;padding-top:4px}
.betform .btn,.betform .form-msg{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;margin:0;padding:0;border:0}
label,legend{padding:0;font-size:12px;font-weight:500;letter-spacing:.1em;color:var(--paper)}
legend{margin-bottom:6px}
input,textarea{width:100%;min-width:0;padding:10px 12px;background:var(--blue-deep);border:2px solid var(--line);border-radius:4px;color:var(--yellow);font:500 16px/1.4 var(--body)}
input:focus,textarea:focus{outline:none;border-color:var(--yellow)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:1}
textarea{resize:vertical}
.amt{display:flex;flex-wrap:wrap;gap:6px}
.amt input{flex:1 1 76px;width:auto;font:800 20px/1.2 var(--num);font-variant-numeric:tabular-nums}
.qa{appearance:none;min-width:46px;padding:0 8px;background:none;border:2px solid var(--line);border-radius:4px;color:var(--yellow);font:800 17px var(--num);cursor:pointer}
.qa[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--blue-deep)}
.form-msg{margin:0;font-size:13.5px;color:var(--paper)}
.form-msg:empty{display:none}
.form-msg.is-err{color:var(--alert)}
.newform,.editform{display:flex;flex-direction:column;gap:14px}
.erow{display:flex;gap:8px;align-items:center}
.erow input{flex:1}
.ecount{min-width:44px;font-size:12px;color:var(--mute);text-align:center;white-space:nowrap}

.btn{appearance:none;padding:13px 18px;border:2px solid var(--yellow);border-radius:4px;background:none;color:var(--yellow);font:700 15px/1.2 var(--body);letter-spacing:.04em;cursor:pointer}
.btn-solid{background:var(--yellow);color:var(--blue-deep)}
.btn-solid:hover{background:#FFE066}
.btn-ghost{border-color:var(--line);color:var(--paper)}
.btn-ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.btn-danger{background:var(--alert);border-color:var(--alert);color:var(--blue-deep)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{align-self:flex-start;padding:8px 14px;font-size:13.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{padding:9px 14px;font-size:13.5px}

/* sections */
.sec{display:flex;flex-direction:column;gap:14px;padding-block:18px 26px;border-top:4px solid var(--yellow)}
.sec-title{margin:0;font:400 32px/1.1 var(--display)}
.sec-sub{margin:-4px 0 0;font-size:14px;color:var(--paper);max-width:62ch}
.tpl{display:flex;flex-wrap:wrap;gap:8px}
.tag{appearance:none;padding:6px 14px;background:none;border:1.5px solid var(--yellow);border-radius:999px;color:var(--yellow);font:500 14px var(--body);cursor:pointer}
.tag:hover{background:var(--yellow);color:var(--blue-deep)}
.empty{margin:0;color:var(--paper)}

.rank{margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.r-no{font:800 24px/1 var(--num);color:var(--mute)}
.rank li.lead .r-no{color:var(--yellow)}
.r-who{display:flex;flex-direction:column;min-width:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.r-who small{font-size:12.5px;font-weight:400;color:var(--mute)}
.r-net{font:800 30px/1 var(--num);font-variant-numeric:tabular-nums;text-align:right}
.r-net small{margin-left:3px;font:500 12px var(--body);color:var(--paper)}
.r-net.neg{color:var(--paper)}
.r-net.zero{color:var(--mute)}

.settings summary{padding:6px 0;color:var(--paper);font-weight:700;cursor:pointer;list-style:none}
.settings summary::-webkit-details-marker{display:none}
.settings summary::before{content:"▸";display:inline-block;width:1.2em;transition:transform .2s}
.settings[open] summary::before{transform:rotate(90deg)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0 16px}
#copy-out{font-size:13.5px;color:var(--paper)}

/* tap-to-edit headings */
[data-edit]{cursor:text;text-decoration:underline dashed var(--line);text-decoration-thickness:2px;text-underline-offset:.2em;border-radius:2px;-webkit-user-select:text;user-select:text}
.title[data-edit]{text-decoration-thickness:3px}
[data-edit]:hover{text-decoration-color:var(--yellow)}
[data-edit]:focus{outline:2px solid var(--yellow);outline-offset:4px;text-decoration:none}
[data-edit]:empty::before{content:attr(data-ph);color:var(--mute)}

.foot{margin-top:8px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.foot p{margin:0 0 8px;max-width:62ch}
.foot b{color:var(--paper)}

.pill{position:fixed;z-index:10;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px);padding:8px 16px;border-radius:999px;background:var(--yellow);color:var(--blue-deep);font-size:13px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.pill button{appearance:none;padding:2px 10px;border:1.5px solid var(--blue-deep);border-radius:999px;background:none;color:var(--blue-deep);font:700 12.5px var(--body);cursor:pointer}

@media (max-width:520px){
  .wrap{padding-inline:16px}
  .betform{grid-template-columns:1fr}
  .opt-odds{font-size:25px}
  .cross{height:46px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

      pill.innerHTML = t ? '<span>' + esc(t) + '</span>' + b : '';
      if (flash && t === flash) {
        clearTimeout(flashTimer);
        flashTimer = setTimeout(function () { if (!cloud.saving && !cloud.err) pill.hidden = true; }, 2600);
      }
      return;
    }
    if (mode === 'sync' || mode === 'boot') {
      if (pub.saving) t = '正在保存，页面会刷新一下…';
      else if (pub.err === 'conflict') t = '盘口刚在别处更新过，正在载入最新版';
      else if (pub.err === 'too_large') t = '内容太多存不下了，删掉几盘再试';
      else if (pub.err === 'fail') { t = '没保存上'; b = '<button type="button" data-act="retry">重试</button>'; }
      else if (pub.dirty) t = ui.editing ? '改完点“保存”后再同步' : '有改动，马上保存…';
      else if (flash) t = flash;
    }
    pill.hidden = !t;
    pill.innerHTML = t ? '<span>' + esc(t) + '</span>' + b : '';
    if (flash && t === flash) {
      clearTimeout(flashTimer);
      flashTimer = setTimeout(function () { if (!pub.dirty && !pub.err && !pub.saving && mode === 'sync') { pill.hidden = true; } }, 2600);
    }
  }

  /* ---------- modes ---------- */
  function toSync() {
    if (mode === 'readonly') return;
    mode = 'sync';
    clearLocal();
    if (pub.dirty) schedule(1500);
    updatePill();
  }
  function toLocal() {
    if (mode === 'local' || mode === 'readonly') return;
    mode = 'local';
    clearTimeout(pub.timer);
    var l = loadLocal();
    if (l && l.updated && (!state.updated || l.updated > state.updated)) { state = l; render(); }
    else if (pub.dirty) saveLocal();
    pub.dirty = false; pub.saving = false;
    updatePill();
  }
  function toReadonly(reason) {
    mode = 'readonly';
    ui.roReason = reason || '';
    clearTimeout(pub.timer);
    pub.dirty = false; pub.saving = false;
    state = clone(embedded);
    ui.editing = ui.editDraft = ui.settling = ui.confirmDel = null; ui.confirmClear = false;
    render(); updatePill();
  }

  /* ---------- 多人下注（Supabase）----------
     盘口结构存 pankou_board.state，注码单独存 pankou_bet 一行一注，
     所以同学同时下注不会互相覆盖。开盘人改盘 → pankou_save（带 rev 乐观锁）。 */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function boardFromUrl() {
    var m = /[?&]board=([A-Za-z0-9_-]{3,40})/.exec(location.search) || /[#&]board=([A-Za-z0-9_-]{3,40})/.exec(location.hash);
    return m ? m[1] : '';
  }
  function suggestBoardId() {
    var d = new Date();
    return 'p' + pad(d.getMonth() + 1) + pad(d.getDate()) + Math.random().toString(36).slice(2, 6);
  }
  function cloudLink() { return location.origin + location.pathname + '?board=' + encodeURIComponent(cloud.board); }
  var ERRS = /(token_short|bad_token|bad_board_id|no_board|market_closed|too_many|bad_amt|no_who)/;
  function rpc(fn, body) {
    return fetch(SB.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {
      method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json', apikey: SB.key, Authorization: 'Bearer ' + SB.key },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.text().then(function (txt) {
        var data = readJSON(txt);
        if (!r.ok) {
          var raw = String((data && (data.message || data.error_description || data.error || data.hint)) || ('http_' + r.status));
          var hit = ERRS.exec(raw);
          throw new Error(hit ? hit[1] : raw);
        }
        return data;
      });
    }, function () { throw new Error('net'); });
  }
  /* 服务器 state 里不带注码，这里把 pankou_bet 的行拼回 markets[].bets，
     下游 tally / ledger / 派彩的算法完全不用改。 */
  function cloudApply(res) {
    var st = normalize(res.state), byM = {};
    st.markets.forEach(function (m) { m.bets = []; byM[m.id] = m; });
    (Array.isArray(res.bets) ? res.bets : []).forEach(function (b) {
      var m = byM[b.m];
      if (!m || !optOf(m, b.o)) return;
      m.bets.push({ id: String(b.id), o: b.o, who: String(b.who || '无名'), amt: num(b.amt), t: +new Date(b.t) || 0 });
    });
    st.rev = +res.rev || 0;
    st.updated = res.updated || st.updated;
    cloud.rev = st.rev;
    state = st;
  }
  function cloudSig(res) {
    var b = Array.isArray(res.bets) ? res.bets : [];
    return String(res.rev) + '|' + b.length + '|' + (b.length ? b[b.length - 1].id : '');
  }
  function editingNow() { return !!(ui.editing || ui.settling || cloud.saving || cloud.saveTimer); }
  function cloudPull(force) {
    if (!cloud.board || cloud.pulling) return Promise.resolve(false);
    cloud.pulling = true;
    return rpc('pankou_get', { p_board: cloud.board }).then(function (res) {
      cloud.pulling = false;
      if (cloud.err === 'net') cloud.err = '';
      if (!res || res.exists === false) {
        if (mode === 'guest') { ui.snapErr = '这个盘口还没开起来。让开盘的人先在他那台设备上点“开启多人下注”，再发一次链接。'; render(); }
        return false;
      }
      var sig = cloudSig(res);
      if (!force && (sig === cloud.sig || editingNow())) { updatePill(); return true; }
      if (editingNow() && !force) return true;
      cloud.sig = sig;
      cloudApply(res);
      render(); updatePill();
      return true;
    }, function (e) {
      cloud.pulling = false;
      if (String(e.message) === 'net') cloud.err = 'net';
      updatePill();
      return false;
    });
  }
  function stripped() {
    var out = clone(state);
    out.markets.forEach(function (m) { m.bets = []; });
    return out;
  }
  function cloudSaveSoon() {
    clearTimeout(cloud.saveTimer);
    cloud.saveTimer = setTimeout(function () { cloud.saveTimer = 0; cloudSave(); }, 700);
  }
  function cloudSave() {
    if (mode !== 'cloud' || !cloud.token) return;
    if (cloud.saving) { cloudSaveSoon(); return; }
    cloud.saving = true; cloud.err = ''; updatePill();
    rpc('pankou_save', { p_board: cloud.board, p_token: cloud.token, p_state: stripped(), p_rev: cloud.rev }).then(function (res) {
      cloud.saving = false;
      if (res && res.ok === false && res.err === 'conflict') {
        cloud.err = 'conflict'; cloud.rev = +res.rev || cloud.rev;
        updatePill(); cloud.sig = ''; cloudPull(true); return;
      }
      cloud.rev = (res && +res.rev) || (cloud.rev + 1);
      state.rev = cloud.rev;
      cloud.sig = '';
      updatePill('已同步，群里的人都能看到了');
    }, function (e) {
      cloud.saving = false;
      var c = String(e.message || '');
      cloud.err = c;
      if (c === 'bad_token') { mode = 'guest'; cloud.token = ''; lsDel(HOST_LS + cloud.board); render(); }
      updatePill();
    });
  }
  function cloudBet(m, o, who, amt) {
    var mid = m.id, d = draft(mid);
    ui.errs[mid] = ''; ui.done[mid] = '正在记…'; render();
    rpc('pankou_place_bet', { p_board: cloud.board, p_market: mid, p_opt: o.id, p_who: who, p_amt: amt }).then(function () {
      ui.done[mid] = '记下了：' + who + ' 押「' + o.label + '」' + fmt(amt) + ' ' + state.unit + '。';
      d.who = ''; d.o = null;
      cloud.sig = ''; cloudPull(true);
    }, function (e) {
      var c = String(e.message || '');
      ui.done[mid] = '';
      ui.errs[mid] = c === 'net' ? '网络不通，这注没记上。过一下再点一次。'
        : c === 'market_closed' ? '这盘刚被封了或者选项改了。刷新一下再押。'
        : c === 'too_many' ? '这一盘的注码已经满了。'
        : c === 'no_who' ? '写上下注人的名字。'
        : c === 'bad_amt' ? '注码不对，换个数。'
        : c === 'no_board' ? '盘口不在了，问一下开盘的人。'
        : '没记上（' + c + '）';
      render();
    });
  }
  function cloudDelBet(bid) {
    if (mode !== 'cloud' || !bid) return;
    rpc('pankou_del_bet', { p_board: cloud.board, p_token: cloud.token, p_bet: String(bid) })
      .then(function () { cloud.sig = ''; cloudPull(true); },
            function (e) { cloud.err = String(e.message || 'net'); updatePill(); });
  }
  /* creating=true：把本机盘口搬上服务器并成为开盘人；false：换设备用口令拿回开盘权 */
  function cloudClaim(board, token, creating) {
    board = String(board || '').trim();
    token = String(token || '').trim();
    var err = !/^[A-Za-z0-9_-]{3,40}$/.test(board) ? '盘口编号只能用字母、数字、短横和下划线，3 到 40 位。'
      : token.length < 4 ? '开盘口令至少 4 位。' : '';
    if (err) { if (creating) cloud.setupErr = err; else cloud.joinErr = err; render(); return; }
    if (creating) cloud.setupErr = ''; else cloud.joinErr = '';
    rpc('pankou_claim', { p_board: board, p_token: token, p_state: creating ? stripped() : {} }).then(function (res) {
      cloud.board = board; cloud.token = token;
      lsSet(HOST_LS + board, token);
      mode = 'cloud'; cloud.err = ''; cloud.joinOpen = false; cloud.joinToken = ''; cloud.sig = '';
      cloud.rev = (res && +res.rev) || 1;
      clearLocal();
      try { history.replaceState(null, '', location.pathname + '?board=' + encodeURIComponent(board)); } catch (e) {}
      startPoll();
      if (creating && res && res.created) { render(); cloudSave(); updatePill('多人下注开起来了，复制链接发群里'); }
      else { cloudPull(true); updatePill(creating ? '这个编号已经有盘口了，已经接上' : '开盘权拿回来了，这台设备可以改盘'); }
    }, function (e) {
      var c = String(e.message || '');
      var msg = c === 'bad_token' ? '口令不对。'
        : c === 'no_board' ? '这个盘口还没开起来，让开盘的人先在他那台设备上开一次。'
        : c === 'token_short' ? '开盘口令至少 4 位。'
        : c === 'bad_board_id' ? '盘口编号不合法。'
        : c === 'net' ? '连不上服务器，检查一下网络。'
        : '没成功（' + c + '）';
      if (creating) cloud.setupErr = msg; else cloud.joinErr = msg;
      render();
    });
  }
  function startPoll() {
    stopPoll();
    cloud.poll = setInterval(function () {
      if (document.hidden || !isCloud() || cloud.saving || cloud.saveTimer) return;
      cloudPull(false);
    }, POLL_MS);
  }
  function stopPoll() { if (cloud.poll) { clearInterval(cloud.poll); cloud.poll = 0; } }
  function initCloud() {
    var id = boardFromUrl();
    if (!id) { cloud.setup.board = suggestBoardId(); toLocal(); render(); return; }
    cloud.board = id;
    cloud.token = lsGet(HOST_LS + id) || '';
    mode = cloud.token ? 'cloud' : 'guest';
    app.innerHTML = '<p class="loading">正在打开盘口…</p>';
    cloudPull(true);
    startPoll();
  }
  function renderCloudBanner() {
    var h = '';
    if (mode === 'guest') {
      h += '<div class="banner"><p>大家一起下注中：填名字、点选项就能押，几秒内所有人看到同一个盘口。封盘、开奖、改字只有开盘的人能做。</p>';
      if (cloud.joinOpen) {
        h += '<div class="field"><label for="join-token">开盘口令</label><input id="join-token" autocomplete="off" maxlength="40" value="' + esc(cloud.joinToken) + '"></div>' +
          '<div class="acts"><button type="button" class="btn btn-solid" data-act="host-join-go">确认</button>' +
          '<button type="button" class="btn btn-ghost" data-act="host-join-no">取消</button></div>';
      } else {
        h += '<div class="acts"><button type="button" class="btn btn-ghost" data-act="cloud-refresh">刷新</button>' +
          '<button type="button" class="btn btn-ghost" data-act="host-join">我是开盘人</button></div>';
      }
      if (cloud.joinErr) h += '<p class="form-msg is-err" role="status">' + esc(cloud.joinErr) + '</p>';
      return h + '</div>';
    }
    return '<div class="banner"><p>你是这个盘口的开盘人（编号 <b>' + esc(cloud.board) + '</b>）。从你发的链接进来的人只能下注。</p>' +
      '<div class="acts"><button type="button" class="btn btn-ghost" data-act="share">复制分享链接</button>' +
      '<button type="button" class="btn btn-ghost" data-act="cloud-refresh">刷新</button></div></div>';
  }
  function renderCloudSetup() {
    return '<details class="settings" id="cloudbox"' + (cloud.setupOpen ? ' open' : '') + '><summary>让同学一起下注</summary><div class="sgrid">' +
      field('cb-board', '盘口编号（会出现在链接里）', cloud.setup.board, 40, '例：sheji1012') +
      field('cb-token', '开盘口令（只有你知道）', cloud.setup.token, 40, '至少 4 位，换手机要用') +
      '</div><p class="sec-sub">点开启以后，这台设备上的盘口会搬到服务器，链接发群里：同学填个名字就能下注，你负责封盘和开奖。口令记在这台设备上；换手机时输一次就能把开盘权拿回去。</p>' +
      '<div class="acts"><button type="button" class="btn btn-solid" data-act="cloud-on">开启多人下注</button></div>' +
      (cloud.setupErr ? '<p class="form-msg is-err" role="status">' + esc(cloud.setupErr) + '</p>' : '') + '</details>';
  }

  function initMode() {
    if (SB.url && SB.key) { initCloud(); return; }
    var C = window.claude;
    if (!C || typeof C.use !== 'function') { toLocal(); return; }
    function get(n) { return Promise.resolve().then(function () { return C.use(n); }).catch(function () { return null; }); }
    Promise.all([get('artifact'), get('user')]).then(function (r) {
      var a = r[0], u = r[1];
      if (!a || typeof a.publish !== 'function') { toLocal(); return; }
      api = a;
      if (!u || typeof u.canEdit !== 'function') { toSync(); return; }
      Promise.resolve().then(function () { return u.canEdit(); }).then(function (ok) {
        if (ok) toSync(); else toReadonly();
      }, toSync);
    });
  }

  /* ---------- boot ---------- */
  var snapP = snapPayload();
  if (snapP) {
    mode = 'snapshot';
    app.innerHTML = '<p class="loading">正在打开盘口…</p>';
    decodeSnap(snapP).then(function (st) {
      state = st; ui.snapAt = st.updated; render();
    }, function (e) {
      ui.snapErr = e && e.message === 'old' ? '这个浏览器版本太旧，打不开盘口链接。升级微信，或者复制链接到手机浏览器里打开。' : '这个盘口链接打不开，可能复制的时候被截断了。请开盘的人重新发一次。';
      mode = 'boot'; render(); initMode();
    });
  } else {
    var s = restore();
    render();
    if (s && s.y) requestAnimationFrame(function () { window.scrollTo(0, s.y); });
    initMode();
    if (s && s.saving && s.rev === embedded.rev) setTimeout(function () { updatePill('已保存，打开链接的人看到的都是这版'); }, 300);
  }
  window.addEventListener('hashchange', function () { if (snapPayload()) location.reload(); });
})();
</script>

</body>
